<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study.ai - Class 11</title>

    <link rel="stylesheet" href="style-11.css">
</head>

<body>

    <!-- Top heading -->
    <header>
        <h1>welcome to class 11</h1>
    </header>


    <!-- Study.ai chat -->
    <main class="chat-container">

        <div class="chat-header">
            <h2>Study.ai Tutor</h2>
            <p>Ask me a question about your studies.</p>
        </div>


        <!-- Messages appear here -->
        <div id="chatMessages">

            <!-- First Study.ai message -->
            <div class="message ai-message">
                <div class="avatar">✦</div>

                <div class="message-content">
                    <strong>Study.ai</strong>
                    <p>
                        Hi! Ask me a question about your studies.
                    </p>
                </div>
            </div>

        </div>

    </main>


    <!-- Input area -->
    <div class="input-area">

        <input
            type="text"
            id="questionInput"
            placeholder="Ask your question..."
            autocomplete="off"
        >

        <button id="sendButton">↑</button>

    </div>


    <script src="script.js"></script>

</body>
</html>
